# Uso: docker compose -f docker-compose.yml -f docker-compose.gpu.yml --profile full up -d
# Requer NVIDIA Container Toolkit no host.
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
  comfyui:
    build:
      args:
        TORCH_VARIANT: cu124
    command: ["--listen", "0.0.0.0", "--port", "8188"]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
